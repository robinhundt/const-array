name: Mutants

permissions: {}

# The full mutation testing run takes too long for every pull request, which
# only tests the mutants in their diff (see pull_request.yml).
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutants (shard ${{ matrix.shard }})
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      # The compile_fail snapshots depend on the exact rustc version.
      CONST_ARRAY_SKIP_COMPILE_FAIL: 1
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: Install cargo-mutants
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-mutants

      - run: cargo mutants --version

      - name: Run mutants
        run: cargo mutants --no-shuffle -vV --shard "$SHARD/4"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
