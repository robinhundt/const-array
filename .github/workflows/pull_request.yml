name: Pull Request

permissions: {}

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: "${{ matrix.os }}"
    strategy:
      matrix:
        os: [ "ubuntu-latest", "windows-latest", "macos-latest" ]
    env:
      # The compile_fail snapshots depend on the exact rustc version, so they
      # only run in the `compile-fail` job below.
      CONST_ARRAY_SKIP_COMPILE_FAIL: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - run: cargo --version

      - name: Run tests
        run: cargo test --verbose --no-fail-fast ${{ runner.os == 'macOS' && '-- --test-threads=1' || '' }}

      - name: Run examples
        shell: bash
        run: |
          for example in examples/*.rs; do
            cargo run --example "$(basename "$example" .rs)"
          done

  compile-fail:
    name: Compile-fail tests
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The expected errors in tests/compile_fail/*.stderr are rustc's exact
      # output. Bump this version deliberately, together with the snapshots:
      # `TRYBUILD=overwrite cargo test --test compile_fail`.
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"

      - run: cargo --version

      - name: Run compile_fail tests
        run: cargo test --test compile_fail

  msrv:
    name: MSRV
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep in sync with `rust-version` in Cargo.toml.
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.85"

      - run: cargo --version

      # Only the library: dev-dependencies such as trybuild need a newer
      # compiler, and users only build the library.
      - name: Check library
        run: cargo check --lib

  miri:
    name: Miri (${{ matrix.name }})
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stacked borrows
            target: x86_64-unknown-linux-gnu
            flags: ""
          - name: tree borrows
            target: x86_64-unknown-linux-gnu
            flags: "-Zmiri-tree-borrows -Zmiri-strict-provenance"
          - name: 32-bit
            target: i686-unknown-linux-gnu
            flags: "-Zmiri-strict-provenance"
          - name: big-endian
            target: s390x-unknown-linux-gnu
            flags: "-Zmiri-strict-provenance"
    env:
      MIRIFLAGS: ${{ matrix.flags }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
          components: "miri"

      - run: cargo --version

      - name: Run miri test
        run: cargo miri test --no-fail-fast --target "$TARGET"

      - name: Run examples under miri
        run: |
          for example in examples/*.rs; do
            cargo miri run --target "$TARGET" --example "$(basename "$example" .rs)"
          done

  lint:
    name: Lint
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
          components: "rustfmt"

      - run: cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "stable"
          components: "clippy"

      - name: Check Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

  docs:
    name: Docs
    runs-on: "ubuntu-latest"
    env:
      # deny rustdoc warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nightly, to build the docs like docs.rs does (see
      # `package.metadata.docs.rs` in Cargo.toml).
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly

      - run: cargo --version

      - name: Check docs
        run: cargo doc --verbose --all-features --no-deps -Zunstable-options -Zrustdoc-scrape-examples

  mutants:
    name: Mutants in the diff
    runs-on: "ubuntu-latest"
    env:
      # The compile_fail snapshots depend on the exact rustc version.
      CONST_ARRAY_SKIP_COMPILE_FAIL: 1
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base commit is needed for the diff.
          fetch-depth: 0

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: Install cargo-mutants
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-mutants

      - run: cargo mutants --version

      - name: Run mutants in the diff
        run: |
          git diff "$BASE_SHA" HEAD > git.diff
          cargo mutants --no-shuffle -vV --in-diff git.diff

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-in-diff
          path: mutants.out

  # The single check that branch protection requires, so that adding, removing
  # or renaming the jobs above doesn't require changing the ruleset. It runs
  # even when a job fails, because GitHub counts a skipped required check as
  # passed.
  ci:
    name: CI
    if: always()
    needs: [test, compile-fail, msrv, miri, lint, docs, mutants]
    runs-on: "ubuntu-latest"
    steps:
      - name: Check that all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required job finished with result: $result"
              exit 1
            fi
          done
